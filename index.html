<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heart Hello World</title>
    <style>
      :root {
        --bg: #101820;
        --heart: #ff5f7e;
        --text: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1f2a44, var(--bg));
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .heart {
        position: relative;
        width: 240px;
        height: 210px;
        background: var(--heart);
        transform: rotate(-45deg);
        border-radius: 20px;
        box-shadow: 0 14px 30px rgba(255, 95, 126, 0.35);
        display: grid;
        place-items: center;
      }

      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: var(--heart);
      }

      .heart::before {
        top: -120px;
        left: 0;
      }

      .heart::after {
        left: 120px;
        top: 0;
      }

      .heart-text {
        transform: rotate(45deg);
        color: var(--text);
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: lowercase;
        z-index: 1;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="heart" aria-label="heart with hello world text">
      <span class="heart-text">hello world</span>
    </div>
  </body>
</html>
